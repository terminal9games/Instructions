<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal 9 - Instructions</title>
<link rel="icon" href="https://i.postimg.cc/bJhgw2zd/Gemini-Generated-Image-kl9ro8kl9ro8kl9r.jpg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Montserrat+Alternates:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --red:#ff0055; --glass:rgba(255,255,255,.03); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#14141a 0%,#0a0a0c 60%); color:#fff; font-family:'Montserrat',sans-serif; display:flex; flex-direction:column; align-items:center; }
  .timer { display:flex; gap:18px; padding:10px 46px 12px; border:1px solid rgba(255,0,85,.35); border-top:0; border-radius:0 0 40px 40px; background:var(--glass); backdrop-filter:blur(16px); }
  .unit { width:58px; text-align:center; }
  .unit b { display:block; font:700 34px/1 'Montserrat Alternates','Montserrat',sans-serif; color:var(--red); text-shadow:0 0 12px rgba(255,0,85,.6); font-variant-numeric:tabular-nums; }
  .unit span { font-size:10px; color:var(--red); }
  main { width:min(640px,92vw); margin:36px 0 12px; padding:24px 28px 34px; border:2px solid rgba(255,255,255,.35); border-radius:14px; background:var(--glass); backdrop-filter:blur(16px); text-align:center; animation:in .7s ease both; }
  .brand { display:flex; gap:10px; align-items:center; justify-content:center; font-weight:700; font-size:19px; }
  .brand img { width:30px; height:30px; }
  h1 { font-size:16px; margin:34px 0 22px; }
  p { font-size:15px; line-height:1.6; margin:0; }
  small { font-size:11px; color:#ddd; }
  @keyframes in { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { main { animation:none; } }
</style>
</head>
<body>
<div class="timer" role="timer" aria-label="Time left">
  <div class="unit"><b id="h">20</b><span>Hours</span></div>
  <div class="unit"><b id="m">00</b><span>Minutes</span></div>
  <div class="unit"><b id="s">00</b><span>Seconds</span></div>
</div>
<main>
  <div class="brand"><img src="https://i.postimg.cc/bJhgw2zd/Gemini-Generated-Image-kl9ro8kl9ro8kl9r.jpg" alt=""> TERMINAL 9</div>
  <h1 id="title">DAY 1</h1>
  <p id="text">Here goes the instructions in montserrat font</p>
</main>
<small>*If you are a player, dont let the timer runs out.</small>
<script>
  // ===== EDIT =====
  const GAME = "https://playportal9.vercel.app";   // URL of the game site (the timer comes from its server)
  const TEXTS = {                                  // text shown for each day
    1: "Press the red button,once the timer hits 7 seconds.",
    2: "Select share or steal. If both players selects share, both pass. If one selects share and the other one selects steal, steal pass. If both selects steal, you get eliminated. You also have a chat where you can talk with your random partner. Good luck and trust your mind.",
    3: "Select a number from the slider from 0 to 100, a formula is applied to your selected number, if your number goes near of 100 without passing 100 you pass, if your number is a very low number than other players or pass from 100 you get eliminated. Think carefully.",
    4: "Sound and some clues, think harder and you'll get the answer."
  };
  // ================
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  let endsAt = null, offset = 0, closed = false;
  async function sync() {
    try {
      const d = await (await fetch(GAME + '/api/status', { cache: 'no-store' })).json();
      offset = d.now - Date.now(); endsAt = d.endsAt; closed = d.closed;
      $('title').textContent = 'DAY ' + d.day;
      $('text').textContent = TEXTS[d.day] || '';
    } catch {}
  }
  function tick() {
    if (!endsAt && !closed) { $('h').textContent = $('m').textContent = $('s').textContent = '--'; return; }
    const t = closed ? 0 : Math.max(0, Math.floor((endsAt - (Date.now() + offset)) / 1000));
    $('h').textContent = pad(Math.floor(t / 3600));
    $('m').textContent = pad(Math.floor(t % 3600 / 60));
    $('s').textContent = pad(t % 60);
  }
  sync(); setInterval(sync, 5000); setInterval(tick, 250); tick();
</script>
</body>
</html>
